<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Rodikil // Reações</title>
  <!--
    Overlay_Reacoes: camada transparente 1920x1080 no TOPO das cenas de live. Reações com som sintetizado
    (sem direitos autorais): gg, clutch, f, pateta, hype, tilt.
    Disparo:
      * atalhos do script obs-config/scripts/rodikil-intro.lua (javascript_event "rodikil-reacao")
      * Painel Rodikil (CallVendorRequest obs-browser emit_event "rodikil-reacao")
      * navegador: botões no rodapé (só fora do OBS) ou ?demo=gg
    Som: "Controlar áudio via OBS" ligado — aparece no mixer como Overlay_Reacoes.
  -->
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
    .fx { position: absolute; inset: 0; pointer-events: none; }
    .center { position: absolute; left: 0; right: 0; top: 200px; height: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .big { font-family: var(--rk-font-display); font-weight: 800; text-transform: uppercase; line-height: .9; color: var(--rk-bone); text-shadow: 0 10px 40px rgba(0,0,0,.6); }
    .kick { font-family: var(--rk-font-mono); text-transform: uppercase; letter-spacing: .3em; font-size: 30px; color: var(--rk-bone); margin-top: 18px; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
    .kick .sep { color: var(--rk-red); }
    .ellipse { position: absolute; width: 300px; height: 560px; border-radius: 50%; background: var(--rk-red); }
    .ring { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px; border: 4px solid var(--rk-bone); border-radius: 50%; }
    .orbit { position: absolute; left: 50%; top: 50%; width: 1100px; height: 300px; margin: -150px 0 0 -550px; border: 3px solid var(--rk-red); border-radius: 50%; transform: rotate(-8deg); }
    .spark { position: absolute; width: 28px; height: 28px; background: var(--rk-bone);
      clip-path: path("M14 0 C15 9 19 13 28 14 C19 15 15 19 14 28 C13 19 9 15 0 14 C9 13 13 9 14 0 Z"); }
    .pill { display: inline-flex; align-items: center; gap: 14px; height: 70px; padding: 0 34px 0 26px; border-radius: 999px; background: var(--rk-red); }
    .pill i { width: 16px; height: 16px; border-radius: 50%; background: var(--rk-bone); }
    .pill b { font-family: var(--rk-font-display); font-weight: 800; font-size: 44px; letter-spacing: .06em; color: var(--rk-bone); }
    .frame { position: absolute; inset: 0; border: 18px solid var(--rk-red); }

    @keyframes slam { 0% { opacity: 0; transform: scale(2.2); } 35% { opacity: 1; transform: scale(.94); } 55% { transform: scale(1.03); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes pop { 0% { opacity: 0; transform: scale(.2); } 60% { opacity: 1; transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes fadeout { to { opacity: 0; } }
    @keyframes ringout { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(30); } }
    @keyframes burst { 0% { opacity: 0; transform: translate(0,0) scale(.2) rotate(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1) rotate(180deg); } }
    @keyframes fall { 0% { opacity: 0; transform: translateY(-120px); filter: grayscale(1); } 40% { opacity: 1; transform: translateY(0); } 100% { opacity: 1; transform: translateY(14px); } }
    @keyframes wobble { 0%,100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-26px) rotate(-6deg); } 75% { transform: translateY(10px) rotate(5deg); } }
    @keyframes flash { 0%,100% { opacity: 0; } 10%,30%,50% { opacity: 1; } 20%,40% { opacity: .2; } }
    @keyframes shake { 0%,100% { transform: translate(0,0); } 10% { transform: translate(-22px,8px); } 20% { transform: translate(18px,-12px); } 30% { transform: translate(-14px,-6px); } 40% { transform: translate(20px,10px); } 50% { transform: translate(-10px,4px); } 60% { transform: translate(8px,-8px); } 70% { transform: translate(-4px,2px); } }
    @keyframes rgb { 0%,100% { text-shadow: -10px 0 var(--rk-red), 10px 0 rgba(244,241,234,.5); } 50% { text-shadow: 10px 0 var(--rk-red), -10px 0 rgba(244,241,234,.5); } }
    @keyframes spin-in { 0% { opacity: 0; transform: rotate(-8deg) scale(.4); } 100% { opacity: .9; transform: rotate(-8deg) scale(1); } }

    /* Prévia no navegador */
    .demo { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 10px; z-index: 5; }
    .demo button { height: 48px; padding: 0 20px; border-radius: 999px; border: 2px solid var(--rk-red); background: rgba(10,10,11,.85); color: var(--rk-bone); font-family: var(--rk-font-display); font-weight: 800; font-size: 22px; letter-spacing: .06em; cursor: pointer; }
    body.is-preview { background: #2a2d33 linear-gradient(135deg, #2a2d33, #16181c); }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="../intro/sfx.js"></script>
  <script>
  (function () {
    "use strict";
    const stage = document.getElementById("stage");
    const sfx = RKSfx.create();
    const queue = [];
    let playing = false;

    function el(html, style) {
      const d = document.createElement("div");
      d.className = "fx"; if (style) d.style.cssText = style;
      d.innerHTML = html; stage.appendChild(d); return d;
    }
    function sparks(n, cx, cy, delay) {
      let h = "";
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2, r = 380 + (i % 3) * 90, s = 0.5 + (i % 4) * 0.25;
        h += `<span class="spark" style="left:${cx}px;top:${cy}px;--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r * 0.7}px;transform:scale(${s});animation:burst 1.1s ${delay}s cubic-bezier(.1,.7,.3,1) both"></span>`;
      }
      return h;
    }

    /* Cada reação: dur (s) + build(t0 do áudio) que monta o visual e agenda o som */
    const R = {
      gg: { dur: 3.2, build(t) {
        el(`<div class="center">
              <div class="ellipse" style="animation:pop .5s cubic-bezier(.2,1.6,.4,1) both"></div>
              <div class="big" style="position:relative;font-size:300px;color:var(--rk-black);animation:slam .55s .08s cubic-bezier(.2,1.4,.4,1) both">GG</div>
            </div>
            <div class="center" style="top:640px;height:auto"><div class="kick" style="animation:pop .4s .35s both">BEM JOGADO <span class="sep">//</span> GALERA</div></div>
            ${sparks(14, 946, 396, 0.1)}`);
        sfx.kick(t, 1); sfx.fanfare(t + 0.08); sfx.shimmer(t + 0.3, 0.1);
      } },
      clutch: { dur: 3, build(t) {
        el(`<div class="orbit" style="top:400px;animation:spin-in .5s .35s var(--rk-ease) both"></div>
            <div class="ring" style="top:400px;animation:ringout .9s .35s cubic-bezier(.1,.7,.3,1) both"></div>
            <div class="center"><div class="big" style="font-size:260px;animation:slam .5s .35s cubic-bezier(.2,1.4,.4,1) both">CLUTCH<span class="rk-accent">!</span></div>
            <div class="kick" style="animation:pop .4s .7s both">SEGURA ESSA <span class="sep">//</span> RODIKIL</div></div>`);
        sfx.riser(t, 0.35, 0.18); sfx.impact(t + 0.35, 1); sfx.shimmer(t + 0.6, 0.1);
      } },
      f: { dur: 3.6, build(t) {
        el(`<div class="center"><div class="big" style="font-size:360px;color:#B8B8BE;animation:fall 1.4s cubic-bezier(.3,.7,.3,1) both">F</div>
            <div class="kick" style="color:#B8B8BE;animation:pop .4s .6s both">NO CHAT <span class="sep">//</span> DESCANSE EM PAZ</div></div>`);
        sfx.trombone(t + 0.1);
      } },
      pateta: { dur: 3.4, build(t) {
        el(`<div class="center"><div style="animation:pop .45s cubic-bezier(.2,1.6,.4,1) both"><span class="pill"><i></i><b>PATETA DA PARTIDA</b></span></div>
            <div class="big" style="font-size:150px;margin-top:20px;animation:pop .4s .15s both, wobble .9s .55s ease-in-out 2">QUEM FOI<span class="rk-accent">?</span></div></div>`);
        sfx.boing(t); sfx.boing(t + 0.55, 0.22); sfx.blip(t + 1.4, 660, 0.05, 0.08, "sine");
      } },
      hype: { dur: 2.8, build(t) {
        el(`<div class="frame" style="animation:flash 1.3s both"></div>
            <div class="center"><div class="big" style="font-size:240px;animation:slam .45s cubic-bezier(.2,1.4,.4,1) both">AGORA <span class="rk-accent">VAI</span>!</div>
            <div class="kick" style="animation:pop .4s .4s both">SOLTA O HYPE NO CHAT</div></div>`);
        sfx.horn(t); sfx.kick(t, 0.8);
      } },
      tilt: { dur: 2.6, build(t) {
        const d = el(`<div class="center" style="animation:shake .7s both"><div class="big" style="font-size:280px;animation:slam .35s cubic-bezier(.2,1.4,.4,1) both, rgb .12s .35s linear 8">TILTOU</div>
            <div class="kick" style="animation:pop .3s .3s both">RESPIRA <span class="sep">//</span> É SÓ UM JOGO</div></div>`);
        sfx.buzz(t, 0.8); sfx.glitch(t, 0.7, 0.16); sfx.impact(t, 0.7);
        return d;
      } }
    };

    function next() {
      if (playing || !queue.length) return;
      const r = R[queue.shift()];
      playing = true;
      const before = stage.children.length;
      r.build(sfx.ctx.currentTime + 0.03);
      const nodes = Array.from(stage.children).slice(before);
      setTimeout(() => nodes.forEach((n) => { n.style.animation = "fadeout .35s forwards"; }), (r.dur - 0.35) * 1000);
      setTimeout(() => { nodes.forEach((n) => n.remove()); playing = false; next(); }, r.dur * 1000);
    }
    function play(tipo) {
      tipo = String(tipo || "").toLowerCase();
      if (!R[tipo]) return;
      if (queue.length < 3) queue.push(tipo);
      if (sfx.ctx.state !== "running") sfx.ctx.resume().catch(() => {}); // o visual nunca espera o áudio
      next();
    }

    // obs-browser: javascript_event / emit_event entregam CustomEvent com detail
    window.addEventListener("rodikil-reacao", (e) => {
      let d = e.detail; if (typeof d === "string") { try { d = JSON.parse(d); } catch (x) { d = { tipo: d }; } }
      play(d && (d.tipo || d.type));
    });
    window.RodikilReacao = play;

    // Escala para prévia em janelas menores
    function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = s === 1 ? "" : `scale(${s})`; }
    addEventListener("resize", fit); fit();

    const demo = new URLSearchParams(location.search).get("demo");
    if (!window.obsstudio) {
      document.body.classList.add("is-preview");
      const bar = document.createElement("div"); bar.className = "demo";
      Object.keys(R).forEach((k) => { const b = document.createElement("button"); b.textContent = k.toUpperCase(); b.onclick = () => play(k); bar.appendChild(b); });
      document.body.appendChild(bar);
    }
    if (demo) setTimeout(() => play(demo), 300);
  })();
  </script>
</body>
</html>
