<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Rodikil // Intro 1 — Órbita</title>
  <!--
    INTRO 1 — ÓRBITA (cinematográfica, 7 s)
    Estrelas surgem -> órbita vermelha se desenha com som subindo -> IMPACTO: a elipse com o R
    aparece -> o nome RODIKIL se revela -> brilhos -> "TRANSMISSÃO // AO VIVO" digitado -> fade p/ preto.
    Browser Source 1920x1080, "Arquivo local", marcar "Controlar áudio via OBS" e
    "Reiniciar quando a cena ficar ativa".
  -->
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="intro.css">
  <style>
    .sky { position: absolute; inset: 0; }
    .play .sky { animation: o-sky 7s var(--rk-ease) both; }
    @keyframes o-sky { 0% { opacity: 0; transform: scale(1.18); } 18% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }

    /* Órbita desenhando (contorno vermelho fino inclinado -8°) */
    .orbit-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    .orbit-svg ellipse { fill: none; stroke: var(--rk-orbit); stroke-width: 2.5; stroke-dasharray: 1; stroke-dashoffset: 1; }
    .play .orbit-svg ellipse { animation: o-draw 2s .2s cubic-bezier(.5,0,.2,1) forwards; }
    .play .orbit-svg { animation: o-orbit-grow 4.8s 2.2s var(--rk-ease) forwards; transform-origin: 960px 500px; }
    @keyframes o-draw { to { stroke-dashoffset: 0; } }
    @keyframes o-orbit-grow { to { transform: scale(1.12); opacity: .8; } }

    /* Onda de choque do impacto */
    .shock {
      position: absolute; left: 960px; top: 500px; width: 40px; height: 40px; margin: -20px 0 0 -20px;
      border: 3px solid var(--rk-bone); border-radius: 50%; opacity: 0;
    }
    .play .shock { animation: o-shock 1.1s 2.2s cubic-bezier(.1,.7,.3,1) forwards; }
    @keyframes o-shock { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(40); } }

    /* Logo: começa só com a elipse (recorte) centralizada e revela o nome. Sem distorcer/girar. */
    .logo-wrap { position: absolute; left: 410px; top: 280px; width: 1100px; height: 440px; }
    .logo-wrap img {
      width: 1100px; height: 440px; display: block;
      clip-path: inset(0 66.1% 0 19.6%); transform: translateX(255.75px);
    }
    .play .logo-wrap { animation: o-pop .7s 2.2s cubic-bezier(.2,1.6,.4,1) both; }
    .play .logo-wrap img { animation: o-reveal .9s 2.65s var(--rk-ease) forwards; }
    @keyframes o-pop {
      0% { opacity: 0; transform: scale(.35); filter: drop-shadow(0 0 0 rgba(250,43,40,0)); }
      30% { opacity: 1; filter: drop-shadow(0 0 60px rgba(250,43,40,.9)); }
      100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 18px rgba(250,43,40,.35)); }
    }
    @keyframes o-reveal { to { clip-path: inset(0 0 0 0); transform: translateX(0); } }

    .play .flash { animation: rk-flash .6s 2.2s ease-out both; }

    .s1 { left: 1420px; top: 300px; } .s2 { left: 470px; top: 640px; } .s3 { left: 1500px; top: 690px; }
    .s2, .s3 { scale: .65; }
    .play .s1 { animation: rk-spark-in .6s 3.3s var(--rk-ease) both, rk-twinkle 2s 3.9s ease-in-out infinite; }
    .play .s2 { animation: rk-spark-in .6s 3.45s var(--rk-ease) both, rk-twinkle 2s 4.05s ease-in-out infinite; }
    .play .s3 { animation: rk-spark-in .6s 3.6s var(--rk-ease) both, rk-twinkle 2s 4.2s ease-in-out infinite; }

    .line { position: absolute; left: 760px; top: 770px; width: 400px; height: 2px; background: var(--rk-divider); transform: scaleX(0); }
    .play .line { animation: o-line .8s 3.7s var(--rk-ease) forwards; }
    @keyframes o-line { to { transform: scaleX(1); } }
    .kicker {
      position: absolute; left: 0; right: 0; top: 800px; text-align: center;
      font-size: 30px; color: var(--rk-bone); white-space: pre;
    }
    .kicker .sep { color: var(--rk-red); }
  </style>
</head>
<body>
  <div id="stage">
    <div class="rk-space">
      <canvas class="rk-stars sky anim" data-seed="23"></canvas>
      <svg class="orbit-svg anim" viewBox="0 0 1920 1080">
        <ellipse cx="960" cy="500" rx="640" ry="170" transform="rotate(-8 960 500)" pathLength="1"></ellipse>
      </svg>
      <div class="shock anim"></div>
      <div class="logo-wrap anim"><img src="../../brand/assets/logo-rodikil-fundo-escuro.png" alt="Rodikil"></div>
      <span class="rk-spark spark s1 anim"></span>
      <span class="rk-spark spark s2 anim"></span>
      <span class="rk-spark spark s3 anim"></span>
      <div class="line anim"></div>
      <p class="rk-mono kicker" id="kicker"></p>
      <div class="layer flash"></div>
      <div class="layer blackout"></div>
    </div>
  </div>

  <script src="../shared/rodikil.js"></script>
  <script src="sfx.js"></script>
  <script src="intro.js"></script>
  <script>
    const TEXT = "TRANSMISSÃO // AO VIVO";
    const TYPE_AT = 3.9, TYPE_STEP = 0.045;
    const kicker = document.getElementById("kicker");
    function typeTo(n) {
      const s = TEXT.slice(0, n);
      kicker.innerHTML = s.replace("//", '<span class="sep">//</span>');
    }
    const steps = [[0, function () { typeTo(0); }]];
    for (let i = 1; i <= TEXT.length; i++) steps.push([TYPE_AT + i * TYPE_STEP, typeTo.bind(null, i)]);

    RKIntro.run({
      duration: 7,
      steps: steps,
      sound: function (s, t) {
        s.drone(t, 6.9, 55, 0.1);
        s.riser(t + 0.2, 2.0, 0.2);
        s.impact(t + 2.2, 1);
        s.whoosh(t + 2.5, 0.75, 400, 4500, 0.35, 0.3, -0.6, 0.8);
        s.shimmer(t + 3.3, 0.11);
        for (let i = 1; i <= TEXT.length; i++) {
          if (TEXT[i - 1] !== " ") s.blip(t + TYPE_AT + i * TYPE_STEP, 1700 + (i % 3) * 230, 0.03, 0.025);
        }
        s.whoosh(t + 6.0, 0.95, 3200, 180, 0.28, 0.45, 0.7, -0.7);
      }
    });
  </script>
</body>
</html>
