; Configurações de referência do perfil OBS do Rodikil (só o que vale para qualquer máquina).
; scripts/setup_obs_profile.py MESCLA estas chaves no basic.ini do perfil — o resto do arquivo é preservado.
; NUNCA coloque aqui: chave de transmissão (fica em service.json), login do YouTube, pastas da máquina.

[Output]
Mode=Advanced
Reconnect=true
RetryDelay=3
MaxRetries=25

[AdvOut]
ApplyServiceSettings=true
Encoder=obs_nvenc_h264_tex
TrackIndex=1
AudioEncoder=ffmpeg_aac
Track1Bitrate=160
RecType=Standard
RecFormat2=mkv
RecEncoder=none
RecAudioEncoder=ffmpeg_aac
RecTracks=1
RecRB=true
RecRBTime=40
RecRBSize=512

[Video]
BaseCX=1920
BaseCY=1080
OutputCX=1920
OutputCY=1080
FPSType=0
FPSCommon=60
ScaleType=bicubic
ColorFormat=NV12
ColorSpace=709
ColorRange=Partial

[Audio]
SampleRate=48000
ChannelSetup=Stereo
